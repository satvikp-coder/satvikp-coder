name: Update profile stats

on:
  schedule:
    - cron: '17 3 * * *'   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/stats.py']

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build cards
        env:
          # Optional: add a PAT as repo secret STATS_TOKEN (scopes: repo, read:user)
          # and set INCLUDE_PRIVATE to 1 to count private repos too.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.STATS_TOKEN && '1' || '0' }}
        run: python scripts/stats.py
      - name: Commit changes
        run: |
          git add assets/*-card.svg
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh stat cards'
          git push
